[package]
name = "shredder"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1.0"
pulldown-cmark = "0.12"
syntect = { version = "5.2", default-features = false, features = ["parsing", "regex-fancy", "html", "default-syntaxes", "default-themes"] }
walkdir = "2.5"
chrono = "0.4"
minify-html = "0.15"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
